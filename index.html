<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Конфигуратор дома — Десктоп</title>
<link rel="stylesheet" href="styles-desktop.css?v=43">
</head>
<body>

<!-- ═══ STEP 1: House type selection (fullscreen) ═══ -->
<div class="d-screen active" id="d-screen-1">
  <div class="d-select-wrap">
    <div class="d-select-title">Выберите тип дома</div>
    <div class="d-house-progress" id="d-house-progress"></div>
    <div class="d-house-grid" id="d-house-grid">
      <!-- Initial loading state — виден сразу при загрузке страницы, до выполнения JS.
           Заменяется карточками в _dInitHouseGrid после загрузки index.json. -->
      <div class="d-grid-initial-loading">
        <div class="d-loading-spinner"></div>
        <div>Загружаем дома…</div>
      </div>
    </div>
    <div class="d-house-extra">
      <div class="d-house-card-empty" data-typeid="no_house" onclick="dSelectHouseAndGo('no_house')">
        <div class="hcp"><div class="ic">🌿</div>Пустой участок, без строений</div>
        <div class="hcl">Участок без дома</div>
      </div>
      <!-- «Дальше» — только для возврата на первый экран: дом уже выбран, и повторно
           кликать по карточке (со сбросом настроек) незачем. См. _dSyncSelectNext.
           Стоит в одном ряду с карточкой «Участок без дома» (TODO п.2). -->
      <div class="d-select-actions" id="d-select-actions">
        <button class="d-btn d-btn-next" onclick="dGoTo(2)">Дальше →</button>
      </div>
    </div>
  </div>
</div>

<!-- ═══ STEP 2: Parameters + 3D ═══ -->
<div class="d-screen" id="d-screen-2">
  <div class="d-params-layout">
    <!-- Left: parameters -->
    <div class="d-params-left">
      <div class="d-params-title">Параметры дома</div>

      <!-- Скроллится только этот блок; заголовок и кнопки приколочены -->
      <div class="d-params-scroll">
      <!-- Глобальные параметры -->
      <div class="d-param-group" id="d-area-group">
        <div class="d-param-head">
          <span class="d-param-label">Общая площадь дома (кв.м)</span>
          <input class="d-param-input" type="number" id="v-area" value="80" min="40" max="100"
                 oninput="dOnAreaTotal()">
        </div>
        <input class="d-param-range" type="range" id="r-area" value="80" min="40" max="100" step="5"
               oninput="document.getElementById('v-area').value=this.value; dOnAreaTotal()">
        <div class="d-param-unit" id="d-area-range-hint"><span>40 кв.м</span><span>100 кв.м</span></div>
      </div>

      <div class="d-param-group">
        <div class="d-param-head">
          <span class="d-param-label">Высота фундамента (см)</span>
          <input class="d-param-input" type="number" id="v-found" value="80" min="15" max="120"
                 oninput="dOnParam()">
        </div>
        <input class="d-param-range" type="range" id="r-found" value="80" min="15" max="120" step="5"
               oninput="document.getElementById('v-found').value=this.value; dOnParam()">
        <div class="d-param-unit"><span>15 см</span><span>120 см</span></div>
      </div>

      <!-- Per-floor параметры (генерируются динамически на основе дескриптора) -->
      <div id="d-floors-params"></div>

      <!-- Материалы дома (крыша/фундамент/стены/рамы) — квадратные образцы -->
      <div id="d-house-mats"></div>
      </div><!-- /.d-params-scroll -->

      <div class="d-params-actions">
        <button class="d-btn d-btn-back" onclick="dGoTo(1)">← Назад</button>
        <button class="d-btn d-btn-next" onclick="dGoTo(3)">Дальше →</button>
      </div>
    </div>

    <!-- Center: 3D viewer -->
    <div class="d-params-center">
      <!-- Подсказка по управлению видом показывается всплывающим окном один раз
           при первом запуске (dShow3dHint), постоянной плашки в углу больше нет. -->
      <div class="d-3d-container" id="d-slot-params"></div>
    </div>
  </div>
</div>

<!-- ═══ STEP 3: Workspace (left sidebar + center + right panel) ═══ -->
<div class="d-screen" id="d-screen-3">
  <div class="d-workspace">

    <!-- LEFT SIDEBAR: button menu -->
    <div class="d-sidebar">
      <div class="d-sidebar-title">Благоустройство</div>
      <div class="d-sidebar-list" id="d-sidebar-list">
        <!-- filled dynamically -->
      </div>
      <!-- Низ панели: «Назад» к параметрам дома. Кнопки «Дальше» больше нет —
           подтверждать раздел не требуется (версия 3D-UI). -->
      <div class="d-sidebar-actions">
        <button class="d-btn d-btn-back" onclick="dBack()">← К параметрам дома</button>
      </div>
    </div>

    <!-- CENTER: 3D + canvas overlay -->
    <div class="d-center">
      <div class="d-center-view">
        <div class="d-center-3d" id="d-slot-workspace"></div>

        <!-- Оверлей размеров и площадей: HTML-плашки поверх 3D, позиции
             считает editor3d.js (e3dOnFrame) — 2D-план убран, размеры
             показываются прямо в сцене, пока раздел открыт. -->
        <div class="d-3d-overlay" id="d-3d-overlay"></div>

        <!-- Индикатор загрузки 3D-моделей (мебель из каталога — 4–12 МБ, 3–10 с).
             Лежит поверх и 3D-вида, и открытого canvas-редактора; управляется
             d3dLoadingSet/d3dLoadingClear в nav-desktop.js. -->
        <div class="d-3d-loading" id="d-3d-loading">
          <div class="d-3d-loading-bar" id="d-3d-loading-bar"><div class="d-3d-loading-fill" id="d-3d-loading-fill"></div></div>
          <div class="d-3d-loading-txt" id="d-3d-loading-txt">Загрузка модели…</div>
        </div>

      </div>
    </div>

    <!-- RIGHT PANEL: materials / catalog -->
    <div class="d-panel" id="d-panel">
      <div class="d-panel-header">
        <div class="d-panel-title" id="d-panel-title">Материалы</div>
      </div>
      <!-- Фильтры цвета и цены живут ЗДЕСЬ, над списком товаров: закреплены и
           сворачиваются, чтобы не съедать высоту списка (ТЗ п. 7). Специфические
           фильтры раздела — в левой панели (п. 8). Наполняет _dRenderFilters. -->
      <div class="d-panel-body" id="d-panel-body">
        <div class="d-panel-filters">
          <button class="d-filters-toggle" id="d-filters-toggle" onclick="dToggleFilters()">
            <span>Фильтры</span><span class="d-filters-caret">▾</span>
          </button>
          <div class="d-filters-box" id="d-filters-box">
            <div class="d-color-section" id="d-color-section">
              <div class="d-color-title">Цвет:</div>
              <div class="d-color-grid" id="d-color-grid"></div>
            </div>
            <div class="d-color-section" id="d-price-section">
              <div class="d-color-title">Цена:</div>
              <div class="d-price-grid" id="d-price-grid"></div>
            </div>
          </div>
          <!-- Sub-toggle (Терраса / Ограждение — only for terrace) -->
          <div class="d-panel-sub-toggle" id="d-panel-sub-toggle" style="display:none;"></div>
        </div>

        <!-- Results (auto-shown) — единственный скроллящийся блок панели -->
        <div class="d-mat-list" id="d-mat-list"></div>
      </div>
      <!-- «СМЕТА» приколочена внизу панели; видна на шаге 3, когда в смете
           есть хотя бы один товар (_dSyncSummaryBtn). -->
      <div class="d-panel-footer">
        <button class="d-fab-summary" id="d-btn-summary" onclick="dShowSummary()" style="display:none">СМЕТА</button>
      </div>
    </div>

  </div>
</div>

<!-- ═══ PHOTO OVERLAY (лупа на карточке товара) ═══ -->
<div class="d-photo-overlay" id="d-photo-overlay" onclick="dHidePhoto()">
  <img id="d-photo-img" src="" alt="">
</div>

<!-- ═══ HINT OVERLAY (инструкция при первом заходе в редактор) ═══ -->
<div class="d-hint-overlay" id="d-hint-overlay">
  <div class="d-hint-box">
    <div class="d-hint-title" id="d-hint-title"></div>
    <div class="d-hint-text" id="d-hint-text"></div>
    <button class="d-btn d-btn-next" onclick="dHideEditorHint()">Понятно</button>
  </div>
</div>

<!-- ═══ SUMMARY OVERLAY ═══ -->
<div class="d-summary-overlay" id="d-summary-overlay">
  <div class="d-summary-box">
    <div class="d-summary-header">
      <div class="d-summary-title">Ваш проект</div>
      <button class="d-panel-close" onclick="dCloseSummary()">✕</button>
    </div>
    <div class="d-summary-body" id="d-sum-body"></div>
    <div class="d-summary-actions">
      <button class="d-summary-btn d-btn-back" onclick="dCloseSummary()">← Закрыть</button>
      <button class="d-summary-btn d-btn-next" onclick="alert('Заявка отправлена!')">ОТПРАВИТЬ ЗАЯВКУ →</button>
    </div>
  </div>
</div>

<!-- ═══ SCRIPTS ═══ -->
<!-- Three.js r128 — захостен локально (cdnjs/jsdelivr недоступны в некоторых сетях) -->
<script src="vendor/three/three.min.js"></script>
<script src="vendor/three/OrbitControls.js"></script>
<script src="vendor/three/RGBELoader.js"></script>
<script src="vendor/three/EXRLoader.js"></script>
<script src="vendor/three/GLTFLoader.js"></script>
<!-- Shared state, canvas engine -->
<script src="state.js?v=70"></script>
<script src="canvas.js?v=58"></script>
<!-- Shared house builder (модульная сборка дома по JSON-дескриптору) -->
<script src="shared/house-builder.js?v=86"></script>
<!-- Каталожный API: домен выбирается по хосту.
       • localhost/127.0.0.1 → '' (same-origin): локальный dev-прокси devserver.py
         проксирует /api и /static на sollersdev.ru.
       • любой другой хост (GitHub Pages и пр.) → напрямую на sollersdev.ru
         (бэкенд теперь отдаёт CORS: Access-Control-Allow-Origin: * на /api и /static).
     На статике (GitHub Pages) прокси нет, поэтому same-origin '' там не работает. -->
<script>
  window.RESOURCE_API_DOMAIN =
    (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
      ? '' : 'https://sollersdev.ru';
</script>
<script src="ResourceManager.js?v=9"></script>
<!-- Расчёты на бэкенде: обёртка бэкендера, подключается как есть, без local-правок.
     Лежит в backend_API/ — это их выгрузка (см. calculation_api.md, calculator.md).
     NB: backend_API/ResourceManager.js — их копия каталожного менеджера, она НЕ
     подключается: рабочий файл — ResourceManager.js в корне. -->
<script src="backend_API/Calculator.js?v=3"></script>
<!-- 3D viewer: core (сцена/материалы/оркестратор) → builders (конструкции) →
     railing (ограждение/навесы). Общая глобальная область, порядок важен. -->
<script src="viewer3d-core.js?v=153"></script>
<script src="viewer3d-builders.js?v=57"></script>
<script src="viewer3d-railing.js?v=16"></script>
<script src="viewer3d-entourage.js?v=14"></script>
<!-- Редактирование прямо в 3D (версия 3D-UI): выбор объектов, сетка, подписи.
     Идёт после viewer3d-*, потому что опирается на threeState и worldToCanvas. -->
<script src="editor3d.js?v=4"></script>
<!-- Desktop navigation & UI -->
<script src="nav-desktop.js?v=118"></script>
</body>
</html>
